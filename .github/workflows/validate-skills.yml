name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - name: Validate catalog and local references
        run: python scripts/validate_skills.py
      - name: Test validator
        run: python -m unittest discover -s tests -v
      - name: Validate Agent Skills frontmatter with reference CLI
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*/; do
            skills-ref validate "$skill"
          done
